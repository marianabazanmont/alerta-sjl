# Pipeline CI/CD DevSecOps de AlertaSJL
# - push/PR a "test": build + pruebas + seguridad (sin desplegar)
# - push a "main" (al hacer merge del PR): build + pruebas + seguridad + DEPLOY a Render
name: CI-CD DevSecOps

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) BUILD: instala dependencias de forma reproducible y ejecuta el linter
  build:
    name: Build y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias (npm ci usa el package-lock exacto)
        run: npm ci
      - name: Lint + SAST (ESLint con eslint-plugin-security)
        run: npm run lint

  # 2) TEST: pruebas unitarias y de integración con cobertura
  test:
    name: Pruebas automatizadas
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas (Jest + Supertest) con umbral de cobertura del 80 %
        run: npm test -- --ci
      - name: Publicar resumen de cobertura en la ejecución
        if: always()
        run: |
          echo "## Cobertura de pruebas" >> "$GITHUB_STEP_SUMMARY"
          node -e "const c=require('./coverage/coverage-summary.json').total; for (const k of ['lines','statements','functions','branches']) console.log('- ' + k + ': ' + c[k].pct + ' %')" >> "$GITHUB_STEP_SUMMARY"
      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage/

  # 3) SECURITY: análisis de dependencias (SCA) y escaneo de secretos
  security:
    name: Análisis de seguridad
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo para que Gitleaks revise todos los commits
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: SCA - npm audit (falla si hay vulnerabilidades altas o críticas en producción)
        run: npm audit --omit=dev --audit-level=high
      - name: Escaneo de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4) DEPLOY: solo en push a main y solo si build, test y security pasaron
  deploy:
    name: Despliegue en Render
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Disparar despliegue (Deploy Hook de Render guardado como secreto)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Smoke test - esperar a que la nueva versión responda /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.APP_URL }}/api/health" | grep -q '"estado":"ok"'; then
              echo "Aplicación desplegada y saludable"; exit 0
            fi
            echo "Esperando despliegue ($i/30)..."; sleep 20
          done
          echo "La aplicación no respondió a tiempo"; exit 1
