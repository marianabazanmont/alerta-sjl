# SAST avanzado con CodeQL (análisis semántico del código de GitHub)
name: CodeQL (SAST)

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # todos los lunes

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analizar JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
